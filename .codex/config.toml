model = "gpt-5.4"
model_reasoning_effort = "medium"
approval_policy = "never"

# Project-scoped secret path deny（GitHub 管理対象）.
# user 側に sandbox_mode があると permission profile は無視されるため、
# この repo では profile で deny を定義し、sandbox_mode は置かない。
default_permissions = "secrets-denied"

[permissions.secrets-denied]
description = "Workspace write + open network; deny .env / secrets; agents must not dump environ"
extends = ":workspace"

[permissions.secrets-denied.filesystem]
# workspace外のreadを閉じ、common toolの実行に要るpathとtoolchainだけを戻す。
":root" = "deny"
":minimal" = "read"
"/opt/homebrew" = "read"
"~/.local/share/mise" = "read"
"~/anaconda3" = "read"
"~/.local/bin" = "read"
"~/bin" = "read"
# gitのidentityと設定。`~/.gitconfig`はdotfilesへのsymlinkなので、実体のdirも開ける。
"~/.gitconfig" = "read"
"~/.gitconfig.local" = "read"
"~/workspace/settings/dotfiles/git" = "read"

[permissions.secrets-denied.filesystem.":workspace_roots"]
"." = "write"
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/secrets" = "deny"
"**/secrets/**" = "deny"

[permissions.secrets-denied.network]
enabled = true

[permissions.secrets-denied.network.domains]
"*" = "allow"
