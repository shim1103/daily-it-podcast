# scope: Playback smoke（Access 以外の本当の e2e。deploy 前・gate 外）
# 実物: npm run test:smoke → playwright（web/vite.smoke.config.ts 上の Hono app 一式・実 TEST R2 binding）
# double: なし。Access のみ持たない（origin が localhost）。test 専用 R2 bucket（daily-it-podcast-dev）
# @require Node（version は apps/playback/.nvmrc）。Playwright chromium。CLOUDFLARE_API_TOKEN Secret / TEST_R2_ACCOUNT_ID Variable が登録済み。
# @ensure smoke 入口が exit 0（TEST bucket が空でも一覧応答は成功する。episode が有る時だけ選択・再生を確認する）。
# @invariant 必須 Unit / Integration gate に載せない。本番credential・本番bucket を読まない。generator を触らない。
# @invariant toolchain の playwright test を YAML に直書きしない。secret 値を log に出さない。
# 判断: docs/decisions/2026-09-15T03-51-41-chore-cd-release-protect-smoke-e2e.md / docs/decisions/2026-09-15T05-36-32-chore-cd-release-protect-smoke-e2e.md
name: playback-smoke

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: apps/playback/.nvmrc
          cache: npm
          cache-dependency-path: apps/playback/package-lock.json

      - name: 依存を install
        working-directory: apps/playback
        run: npm ci

      - name: Playwright chromium を install
        working-directory: apps/playback
        run: npx playwright install --with-deps chromium

      - name: smoke を実行
        working-directory: apps/playback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.TEST_R2_ACCOUNT_ID }}
        run: npm run test:smoke
