# scope: Playback 進捗 D1 疎通（dispatch 専用・gate 外。一過性）
# 実物: scripts/playback/test-d1-smoke.sh → wrangler d1 migrations apply + vitest（test/dispatch）
# double: なし（実 TEST D1・実 TEST R2。共有 test/support/wrangler.smoke.jsonc）
# @require Node（version は apps/playback/.nvmrc）。CLOUDFLARE_API_TOKEN Secret（D1 編集権限）/ R2_ACCOUNT_ID Variable（本番・test 共通の account）が登録済み。
# @ensure d1-smoke 入口が exit 0（TEST D1 へ migration 適用済みで、D1 の書く・読む・消すが成功し、D1・R2 とも binding が remote へ届く）。probe は test 側が自前 delete する。
# @invariant 必須 Unit / Integration / System gate に載せない。cron を持たない。inputs を持たない（test 固定）。本番 D1・本番 bucket に触れない。
# @invariant toolchain の wrangler・vitest を YAML に直書きしない。secret 値を log に出さない。
# @invariant PASS を1度確認した後、本 workflow と疎通専用実装（apps/playback/test/dispatch/・scripts/playback/test-d1-smoke.sh）を削除する。
# 判断: docs/decisions/2026-09-30T12-32-02 / 2026-09-30T12-32-03 / 2026-09-30T13-30-00 / 2026-09-16T13-46-41
name: playback-d1-smoke

on:
  workflow_dispatch:

jobs:
  d1-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: apps/playback/.nvmrc
          cache: npm
          cache-dependency-path: apps/playback/package-lock.json

      - name: 依存を install
        working-directory: apps/playback
        run: npm ci

      - name: D1 疎通を実行
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
        run: ./scripts/playback/test-d1-smoke.sh
