# scope: Capability probe（明示実行のみ。通常の push / pull_request gate に入らない）
# 実物: scripts/generator/probe-cursor-cli.sh
# double: なし（Cursor API を test 用 credential で実際に叩く）
# @require test 用 CURSOR_API_KEY が Secrets に登録済み。ubuntu-latest runner。
# @ensure 各 environment case が独立実行され、1 case の失敗が残りの結果を失わせない。
#         各 case の入力条件・exit 結果・binary path・分類結果が step summary に残る。
# @invariant CURSOR_API_KEY の値・prompt 本文・stdout 本文・stderr 本文を workflow log / artifact へ出さない。
#            例外: PROBE_REVEAL_STDERR=1 を渡している間は stderr 先頭300byteが workflow log(step summary)へ出る。
#            production workflow を変更しない。probe 完了後に削除する一時 artifact。
name: probe-cursor-cli

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [full, no-home, no-tmpdir, minimal-path]
    steps:
      - uses: actions/checkout@v4

      - name: probe を実行
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          PROBE_CASE: ${{ matrix.case }}
          # この開示は 259 byte stderr の失敗理由(キー未読込 / entitlement / trust / その他)特定のための一時措置。
          # 判明後に PROBE_REVEAL_STDERR と probe-cursor-cli.sh の開示分岐ごと削除する(Issue Phase 4 と同時か手前)。
          PROBE_REVEAL_STDERR: "1"
        run: scripts/generator/probe-cursor-cli.sh "$PROBE_CASE"
