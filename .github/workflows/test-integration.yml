# scope: Narrow Integration（CI 上の Integration gate）
# 実物: scripts/test-integration.sh
# double: なし（外部 API は叩かない）
# @require Go（version は apps/generator/go.mod）と Node（version は apps/playback/.nvmrc）が使える runner。
# @ensure Integration 入口が exit 0。
# @invariant 本番 credential を使わない。Unit 専用 suite をこの workflow の必須条件にしない。
# @invariant toolchain の test command を YAML に直書きしない。
name: test-integration

on:
  push:
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/generator/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/playback/.nvmrc
          cache: npm
          cache-dependency-path: apps/playback/package-lock.json

      - name: playback 依存を install
        working-directory: apps/playback
        run: npm ci

      - name: Integration を実行
        run: ./scripts/test-integration.sh
