# scope: Generator System（credential 付き・gate 外）
# 実物: scripts/generator/test-system.sh
# double: なし（test 専用 credential）
# @require Go（version は apps/generator/go.mod）。test 用 TEST_* Secrets / Variables が登録済み。
# @ensure System 入口が exit 0。$GITHUB_STEP_SUMMARY に top-level test の pass/total。
# @invariant 必須 Unit / Integration gate に載せない。全 credential は TEST_*（本番 Secrets / Variables を使わない。Decision 2026-09-03T14-45-00）。playback を触らない。
# @invariant toolchain の go test を YAML に直書きしない。secret 値を log に出さない。
# 判断: docs/decisions/2026-08-30T11-56-01 / 2026-08-30T12-49-00 / 2026-08-30T12-49-01 / 2026-08-30T16-23-00 / 2026-09-03T14-45-00
# 判断: cron・dispatch とも -tags=system の全 System test を実行する（実行対象パターン切替なし）。rate 計測は generator-tts-rate.yml / generator-draft-rate.yml へ分離（ratemeasure tag）。
name: generator-system

on:
  schedule:
    # 毎週月曜 07:00 Asia/Tokyo = 日曜 22:00 UTC
    - cron: "0 22 * * 0"
  workflow_dispatch:

jobs:
  system:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/generator/go.mod

      - name: System Test を実行
        env:
          CURSOR_API_KEY: ${{ secrets.TEST_CURSOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.TEST_GEMINI_API_KEY }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.TEST_GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.TEST_GOOGLE_OAUTH_CLIENT_ID }}
          DRIVE_FOLDER_ID: ${{ vars.TEST_DRIVE_FOLDER_ID }}
        run: ./scripts/generator/test-system.sh

      - name: PASS 率を summary へ
        if: always()
        run: ./scripts/generator/system-summary.sh
