# scope: Generator System（credential 付き・gate 外）
# 実物: scripts/generator/test-system.sh
# double: なし（credential は値が本番と異なるものだけ TEST_* を維持し、値が同一のものは本番 Secrets / Variables を使う）
# @require Go（version は apps/generator/go.mod）。test 用 TEST_* Secrets / Variables および CURSOR_API_KEY / SPARE_GEMINI_API_KEY / R2_ACCOUNT_ID が登録済み。ffmpeg が使える runner。
# @ensure System 入口を既定 1 topic で実行して exit 0。$GITHUB_STEP_SUMMARY に top-level test の pass/total。
# @invariant 必須 Unit / Integration gate に載せない。credential は値が本番と異なるものだけ TEST_* を維持し、値が同一のものは本番 Secrets / Variables へ統合する（Decision 2026-09-16T00-39-21）。playback を触らない。
# @invariant toolchain の go test を YAML に直書きしない。secret 値を log に出さない。
# 判断: docs/decisions/2026-08-30T11-56-01 / 2026-08-30T12-49-00 / 2026-08-30T12-49-01 / 2026-08-30T16-23-00 / 2026-09-03T14-45-00 / 2026-09-15T03-51-41 / 2026-09-16T00-39-21 / 2026-09-17T10-36-05 / 2026-09-17T14-30-00 / 2026-09-17T14-41-00
# 判断: push・dispatch とも -tags=system の全 System test を実行する（実行対象パターン切替なし）。rate 計測は generator-tts-rate.yml / generator-draft-rate.yml へ分離（ratemeasure tag）。master push 契機の CD 連鎖（generator-system → playback-deploy → playback-e2e）の起点は本 workflow が持つ（Decision 2026-09-17T14-30-00）。
name: generator-system

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      topic_count:
        description: "System test の topic 数（既定は疎通確認用の 1）"
        required: false
        default: "1"

# why: system-test は Run 前に同日 date 一致 json（+ sibling mp3、不完全残骸含む）を
#   test bucket から消す（Decision generator-system-test-same-day-fixture-reset）。
#   並行 run が同じ暦日を掃除・書込すると競合し得るため concurrency で直列化する。別日は触らない。
concurrency:
  group: generator-system
  cancel-in-progress: false

jobs:
  system:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/generator/go.mod

      - name: ffmpeg を install
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: System Test を実行
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.TEST_GEMINI_API_KEY }}
          SPARE_GEMINI_API_KEY: ${{ secrets.SPARE_GEMINI_API_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.TEST_R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.TEST_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.TEST_R2_SECRET_ACCESS_KEY }}
          SYSTEM_TEST_TOPIC_COUNT: ${{ inputs.topic_count }}
        run: ./scripts/generator/test-system.sh

      - name: PASS 率を summary へ
        if: always()
        run: ./scripts/generator/system-summary.sh
