# scope: Generator System（credential 付き・gate 外）
# 実物: scripts/generator/test-system.sh
# double: なし（credential は値が本番と異なるものだけ TEST_* を維持し、値が同一のものは本番 Secrets / Variables を使う）
# @require Go（version は apps/generator/go.mod）。test 用 TEST_* Secrets / Variables および CURSOR_API_KEY / SPARE_GEMINI_API_KEY / R2_ACCOUNT_ID が登録済み。ffmpeg が使える runner。
# @ensure System 入口が exit 0。$GITHUB_STEP_SUMMARY に top-level test の pass/total。
# @invariant 必須 Unit / Integration gate に載せない。credential は値が本番と異なるものだけ TEST_* を維持し、値が同一のものは本番 Secrets / Variables へ統合する（Decision 2026-09-16T00-39-21）。playback を触らない。
# @invariant toolchain の go test を YAML に直書きしない。secret 値を log に出さない。
# 判断: docs/decisions/2026-08-30T11-56-01 / 2026-08-30T12-49-00 / 2026-08-30T12-49-01 / 2026-08-30T16-23-00 / 2026-09-03T14-45-00 / 2026-09-15T03-51-41 / 2026-09-16T00-39-21 / 2026-09-17T10-36-05
# 判断: pull_request・dispatch とも -tags=system の全 System test を実行する（実行対象パターン切替なし）。rate 計測は generator-tts-rate.yml / generator-draft-rate.yml へ分離（ratemeasure tag）。
name: generator-system

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      topic_count:
        description: "System test の topic 数（未指定なら本番と同じ DraftTopicCountTarget を使う）"
        required: false
        default: ""

# why: 旧 Drive 用の直列化理由（test 用 Drive folder の書込・検証・削除を1 runで完結する設計。
#   Decision 2026-08-30T16-23-00）は Google OAuth / Drive 実装の撤去により成立しなくなった。
#   R2 側は produce_episode_system_test.go の @invariant により同 stem upsert で残骸許容・cleanup なしの
#   設計であり、同一 test 用 R2 bucket への並行書込が競合する根拠は現状確認できていない。
#   ただし直列化を外すことは挙動変更になるため、確信が持てるまでは concurrency 自体は保持する。
concurrency:
  group: generator-system
  cancel-in-progress: false

jobs:
  system:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/generator/go.mod

      - name: ffmpeg を install
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: System Test を実行
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.TEST_GEMINI_API_KEY }}
          SPARE_GEMINI_API_KEY: ${{ secrets.SPARE_GEMINI_API_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.TEST_R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.TEST_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.TEST_R2_SECRET_ACCESS_KEY }}
          SYSTEM_TEST_TOPIC_COUNT: ${{ inputs.topic_count }}
        run: ./scripts/generator/test-system.sh

      - name: PASS 率を summary へ
        if: always()
        run: ./scripts/generator/system-summary.sh
