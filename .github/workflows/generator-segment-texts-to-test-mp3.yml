# scope: 完成稿 json から TTS→sec 更新→TEST Drive へ json+mp3（dispatch 専用・gate 外・正常系）
# 実物: scripts/generator/segment-texts-to-test-mp3.sh → hack/segment-texts-to-mp3
# double: なし（TEST_GEMINI_API_KEY + TEST Drive OAuth）
# @require Go（version は apps/generator/go.mod）。ffmpeg。TEST_* secret/var が登録済み。
# @ensure 入口が exit 0（TEST folder に {episodeId}.{json,mp3}。json の sec だけ TTS 後）。
# @invariant 必須 Unit / Integration gate に載せない。cron を持たない。本番 credential を読まない。
# @invariant 原稿 text は変えない。細かい set verify をしない。secret 値を log に出さない。
name: generator-segment-texts-to-test-mp3

on:
  workflow_dispatch:
    inputs:
      manuscript_json:
        description: "完成稿 manuscript JSON 全文（sec 以外は一言一句維持）"
        required: true
        type: string

jobs:
  synthesize-upload-test-mp3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/generator/go.mod

      - name: ffmpeg を入れる
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: manuscript → sec 更新 + TEST json/mp3
        env:
          MANUSCRIPT_JSON: ${{ inputs.manuscript_json }}
          TEST_GEMINI_API_KEY: ${{ secrets.TEST_GEMINI_API_KEY }}
          TEST_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.TEST_GOOGLE_OAUTH_CLIENT_ID }}
          TEST_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_SECRET }}
          TEST_GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.TEST_GOOGLE_OAUTH_REFRESH_TOKEN }}
          TEST_DRIVE_FOLDER_ID: ${{ vars.TEST_DRIVE_FOLDER_ID }}
        run: ./scripts/generator/segment-texts-to-test-mp3.sh
