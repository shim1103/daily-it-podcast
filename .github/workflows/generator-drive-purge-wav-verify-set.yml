# scope: Drive 上の旧 .wav を削除し、完成ペア（json+mp3）のみを確認する（dispatch 専用・gate 外）
# 実物: scripts/generator/drive-purge-wav-verify-set.sh → hack/drive-wav-purge
# double: なし（Drive 実 folder）
# @require Go（version は apps/generator/go.mod）。input target に応じた Drive OAuth / folder だけが登録済み。
# @ensure purge+verify 入口が exit 0（.wav 非残存・各 stem が {json,mp3}）。
# @invariant 必須 Unit / Integration gate に載せない。cron を持たない。Cursor / Gemini secret を読まない。
# @invariant toolchain の go を YAML に直書きしない（入口 script 経由）。secret 値を log に出さない。
# 判断: docs/tasks/todo/audio-mp3-cutover-migrate.md / docs/decisions/2026-09-13T13-40-29
name: generator-drive-purge-wav-verify-set

on:
  workflow_dispatch:
    inputs:
      target:
        description: "対象 Drive folder（prod = 本番 DRIVE_* / test = TEST_DRIVE_*）"
        required: true
        type: choice
        options:
          - test
          - prod

jobs:
  purge-verify-test:
    if: inputs.target == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/generator/go.mod

      - name: wav 削除と完成ペア検証（test）
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.TEST_GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.TEST_GOOGLE_OAUTH_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ vars.TEST_DRIVE_FOLDER_ID }}
        run: ./scripts/generator/drive-purge-wav-verify-set.sh test

  purge-verify-prod:
    if: inputs.target == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/generator/go.mod

      - name: wav 削除と完成ペア検証（prod）
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
        run: ./scripts/generator/drive-purge-wav-verify-set.sh prod
