# scope: Generator Gemini generateContent 原稿 Adapter の実 API 疎通 smoke（dispatch 専用・gate 外）
# 実物: scripts/generator/test-geminiapi-smoke.sh → go test -tags="system ratemeasure" TestGeminiAPISmoke
# double: なし（test 専用 credential TEST_GEMINI_API_KEY）
# @require Go（version は apps/generator/go.mod）。TEST_GEMINI_API_KEY Secret が登録済み。
#          geminiapi package を含む ref で dispatch する（fallback 実装済み branch。master 単独では compile fail）。
# @ensure geminiapi-smoke 入口が exit 0（Write が 1 回で非空断片を返す）。$GITHUB_STEP_SUMMARY に疎通結果 1 行。
# @invariant 必須 Unit / Integration gate に載せない。cron を持たない。本番 Secrets を使わない。
# @invariant toolchain の go test を YAML に直書きしない。secret 値を log に出さない。PASS 率・原稿品質は測らない。
# 判断: docs/decisions/2026-09-07T19-06-00 / 2026-09-03T14-45-00
name: generator-geminiapi-smoke

on:
  workflow_dispatch:

jobs:
  geminiapi-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/generator/go.mod

      - name: geminiapi 疎通 smoke を実行
        env:
          TEST_GEMINI_API_KEY: ${{ secrets.TEST_GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          ./scripts/generator/test-geminiapi-smoke.sh 2>&1 | tee /tmp/geminiapi-smoke.log

      - name: 疎通結果を summary へ
        if: always()
        run: ./scripts/generator/geminiapi-smoke-summary.sh
