# scope: Generator R2 疎通確認（dispatch 専用・gate 外。System / E2E とは別）
# 実物: scripts/generator/test-r2-smoke.sh → go test -tags=r2smoke TestR2Smoke
# double: なし（test 専用 credential TEST_R2_*）
# @require Go（version は apps/generator/go.mod）。test 用 TEST_R2_* Secrets / Variables が登録済み。
# @ensure r2-smoke 入口が exit 0（test bucket への Put/List/Get 往復成功）。probe object は test 側で自前 delete。
# @invariant 必須 Unit / Integration / System gate に載せない。cron を持たない。本番 R2_* Secrets / Variables を使わない
#   （Decision 2026-09-03T14-45-00 の TEST_* 隔離方針と同型）。
# @invariant stem pair 整合・schema 適合は見ない。test/prod 切替引数は持たない（test 固定。Decision 2026-09-16T10-45-14 §1-2）。
# @invariant toolchain の go test を YAML に直書きしない。secret 値を log に出さない。playback を触らない。
# 判断: docs/decisions/2026-09-16T10-45-14-feature-r2-smoke-migrate-cutover.md
name: generator-r2-smoke

on:
  workflow_dispatch:

jobs:
  r2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/generator/go.mod

      - name: R2 疎通 smoke を実行
        env:
          TEST_R2_ACCOUNT_ID: ${{ vars.TEST_R2_ACCOUNT_ID }}
          TEST_R2_BUCKET: ${{ vars.TEST_R2_BUCKET }}
          TEST_R2_ACCESS_KEY_ID: ${{ secrets.TEST_R2_ACCESS_KEY_ID }}
          TEST_R2_SECRET_ACCESS_KEY: ${{ secrets.TEST_R2_SECRET_ACCESS_KEY }}
        run: ./scripts/generator/test-r2-smoke.sh
